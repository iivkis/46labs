name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline self-tests
        run: |
          find labs -type f -name '*.sh' -exec bash -n {} +
          find labs -type f -name '*.py' -exec python3 -m py_compile {} +
          python3 labs/siit-dc/translator.py --selftest
          python3 labs/wan-capabilities/probe.py --selftest
          python3 labs/transition-edge/transition.py selftest
          python3 labs/real-relay/relay.py selftest
